<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portraits | People | Michael Wolfenberger</title>
  <meta name="description" content="Candid, available-light portraits in natural environments. Photography by Michael Wolfenberger.">
  <meta name="author" content="Michael Wolfenberger">
  <link rel="canonical" href="https://michaelwolfenberger.com/portraits.html">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Portraits | People | Michael Wolfenberger">
  <meta property="og:description" content="Candid, available-light portraits in natural environments.">
  <meta property="og:url" content="https://michaelwolfenberger.com/portraits.html">
  <meta property="og:site_name" content="Michael Wolfenberger">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "CollectionPage",
    "name": "Portraits | People — Michael Wolfenberger",
    "description": "Candid, available-light portraits in natural environments.",
    "url": "https://michaelwolfenberger.com/portraits.html",
    "author": { "@type": "Person", "name": "Michael Wolfenberger", "url": "https://michaelwolfenberger.com" }
  }
  </script>

  <style>
    :root {
      --bg-color:      #0d1117;
      --card-bg:       #161b22;
      --text-color:    #c9d1d9;
      --heading-color: #f0f6fc;
      --accent-color:  #58a6ff;
      --border-color:  #30363d;
      --muted-color:   #8b949e;
      --font-family:   -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: var(--font-family);
      line-height: 1.7;
    }

    nav {
      max-width: 900px;
      margin: 0 auto;
      padding: 2rem 1.5rem 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
    }

    nav a {
      color: var(--accent-color);
      text-decoration: none;
      font-weight: 500;
      transition: opacity 0.2s ease;
    }

    nav a:hover { opacity: 0.75; }
    nav span { color: var(--muted-color); font-size: 0.9rem; }

    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 3rem 1.5rem 2rem;
    }

    .page-header {
      padding-bottom: 2.5rem;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 3rem;
    }

    .page-header h1 {
      color: var(--heading-color);
      font-size: 2.5rem;
      line-height: 1.2;
      margin-bottom: 0.75rem;
    }

    .page-header p {
      font-size: 1.1rem;
      color: var(--muted-color);
      max-width: 620px;
    }

    /* ── Photo Grid ── */
    .photo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 0.75rem;
    }

    .photo-thumb {
      aspect-ratio: 4 / 3;
      overflow: hidden;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      cursor: zoom-in;
      transition: border-color 0.2s ease, transform 0.2s ease;
      background: #0a0f16;
    }

    .photo-thumb:hover {
      border-color: var(--accent-color);
      transform: translateY(-2px);
    }

    .photo-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.3s ease;
    }

    .photo-thumb:hover img { transform: scale(1.03); }

    /* ── Empty State ── */
    .empty-state {
      text-align: center;
      padding: 5rem 1rem;
      color: var(--muted-color);
    }

    .empty-state p {
      font-size: 1rem;
      margin-bottom: 0.5rem;
    }

    .empty-state a {
      color: var(--accent-color);
      text-decoration: none;
      font-size: 0.9rem;
    }

    /* ── Lightbox ── */
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.93);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }

    .lightbox.open { display: flex; }

    .lb-img {
      max-width: 90vw;
      max-height: 88vh;
      object-fit: contain;
      border-radius: 4px;
      display: block;
      user-select: none;
    }

    .lb-close {
      position: absolute;
      top: 1.25rem;
      right: 1.5rem;
      background: none;
      border: none;
      color: #fff;
      font-size: 2.25rem;
      line-height: 1;
      cursor: pointer;
      opacity: 0.6;
      transition: opacity 0.2s;
      padding: 0.25rem 0.5rem;
    }

    .lb-close:hover { opacity: 1; }

    .lb-prev, .lb-next {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #fff;
      font-size: 3rem;
      line-height: 1;
      cursor: pointer;
      opacity: 0.4;
      transition: opacity 0.2s;
      padding: 1rem;
      user-select: none;
    }

    .lb-prev { left: 0.5rem; }
    .lb-next { right: 0.5rem; }
    .lb-prev:hover, .lb-next:hover { opacity: 0.9; }
    .lb-prev[hidden], .lb-next[hidden] { display: none; }

    .lb-counter {
      position: absolute;
      bottom: 1.25rem;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.45);
      font-size: 0.8rem;
      letter-spacing: 0.06em;
      font-family: var(--font-family);
    }

    footer {
      max-width: 900px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
      border-top: 1px solid var(--border-color);
      font-size: 0.88rem;
      color: var(--muted-color);
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    footer a { color: inherit; text-decoration: none; }
    footer a:hover { color: var(--accent-color); }

    @media (max-width: 600px) {
      .page-header h1 { font-size: 2rem; }
      .photo-grid { grid-template-columns: 1fr 1fr; gap: 0.5rem; }
      .lb-prev { left: 0; }
      .lb-next { right: 0; }
    }
  </style>
</head>
<body>

  <nav>
    <a href="photography.html">&larr; Photography</a>
    <span>Portraits | People</span>
  </nav>

  <main>
    <div class="page-header">
      <h1>Portraits %%TITLE%% People</h1>
      <p>Candid, available-light portraits in natural environments.</p>
    </div>

    <div class="photo-grid" id="photo-grid"></div>

    <div class="empty-state" id="empty-state" hidden>
      <p>No photos in this section yet.</p>
      <a href="photography.html">&larr; Back to Photography</a>
    </div>
  </main>

  <footer>
    <span>&copy; 2026 Michael Wolfenberger. All rights reserved.</span>
    <span><a href="index.html">michaelwolfenberger.com</a></span>
  </footer>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer">
    <button class="lb-close" id="lb-close" aria-label="Close">&times;</button>
    <button class="lb-prev" id="lb-prev" aria-label="Previous photo">&#8249;</button>
    <img class="lb-img"    id="lb-img" src="" alt="">
    <button class="lb-next" id="lb-next" aria-label="Next photo">&#8250;</button>
    <div class="lb-counter" id="lb-counter"></div>
  </div>

  <script src="gallery-config.js"></script>
  <script>
    const SECTION_KEY = 'portraits';
    const images      = GALLERY_IMAGES[SECTION_KEY] || [];
    const grid        = document.getElementById('photo-grid');
    const empty       = document.getElementById('empty-state');
    const lightbox    = document.getElementById('lightbox');
    const lbImg       = document.getElementById('lb-img');
    const lbCounter   = document.getElementById('lb-counter');
    const lbPrev      = document.getElementById('lb-prev');
    const lbNext      = document.getElementById('lb-next');

    let current = 0;

    /* ── Build grid ── */
    if (!images.length) {
      empty.hidden = false;
    } else {
      images.forEach((src, i) => {
        const thumb = document.createElement('div');
        thumb.className = 'photo-thumb';
        thumb.innerHTML = '<img src="' + src + '" alt="' + (GALLERY_META[SECTION_KEY].title) + ' — photo ' + (i + 1) + '" loading="lazy">';
        thumb.addEventListener('click', () => openLightbox(i));
        grid.appendChild(thumb);
      });
    }

    /* ── Lightbox ── */
    function openLightbox(index) {
      current = index;
      updateLightbox();
      lightbox.classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
      lightbox.classList.remove('open');
      document.body.style.overflow = '';
    }

    function updateLightbox() {
      lbImg.src     = images[current];
      lbImg.alt     = GALLERY_META[SECTION_KEY].title + ' — photo ' + (current + 1);
      lbCounter.textContent = images.length > 1 ? (current + 1) + ' / ' + images.length : '';
      lbPrev.hidden = images.length <= 1;
      lbNext.hidden = images.length <= 1;
    }

    function prev() { current = (current - 1 + images.length) % images.length; updateLightbox(); }
    function next() { current = (current + 1) % images.length; updateLightbox(); }

    document.getElementById('lb-close').addEventListener('click', closeLightbox);
    lbPrev.addEventListener('click', prev);
    lbNext.addEventListener('click', next);

    /* Click outside image to close */
    lightbox.addEventListener('click', e => { if (e.target === lightbox) closeLightbox(); });

    /* Keyboard navigation */
    document.addEventListener('keydown', e => {
      if (!lightbox.classList.contains('open')) return;
      if (e.key === 'Escape')      closeLightbox();
      if (e.key === 'ArrowLeft')   prev();
      if (e.key === 'ArrowRight')  next();
    });
  </script>

</body>
</html>
